name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  PROJECT_ID: project-e99023b7-062a-4d00-873
  REGION: australia-southeast1
  SERVICE: dian-dian-site
  IMAGE: australia-southeast1-docker.pkg.dev/project-e99023b7-062a-4d00-873/web/dian-dian-site
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/625283447919/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@project-e99023b7-062a-4d00-873.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - run: docker build -f Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} .
      - run: docker push ${{ env.IMAGE }}:${{ github.sha }}
      - run: >
          gcloud run deploy ${{ env.SERVICE }}
          --image ${{ env.IMAGE }}:${{ github.sha }}
          --region ${{ env.REGION }}
          --allow-unauthenticated --min-instances 0 --quiet
